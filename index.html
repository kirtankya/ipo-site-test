<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPO & GMP Live Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>📊 IPO & GMP Live Data</h1>
      <p>Real-time Grey Market Premium and IPO List</p>
    </header>

    <!-- Controls / Search -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Company or Sector search..." />
      <select id="categorySelect">
        <option value="all">All Category</option>
        <option value="IPO">Mainboard IPO</option>
        <option value="SME">SME IPO</option>
      </select>
      <select id="statusSelect">
        <option value="all">All Status</option>
        <option value="O">Open</option>
        <option value="U">Upcoming</option>
        <option value="C">Closed</option>
      </select>
      <button id="refreshBtn">🔄 Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table class="simple-table">
        <thead>
          <tr>
            <th>Company Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Price (₹)</th>
            <th>GMP (₹)</th>
            <th>Est. Profit (%)</th>
            <th>Subscription</th>
            <th>Dates</th>
            <th>Listing Date</th>
            <th>Allotment</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="10" class="loading">Loading data from live server...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
